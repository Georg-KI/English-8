<style>
:root{--line:#00539C;--sun:#FFD662;--page:#F0F4F8;--card:#fff;--text:#1A1A1A;--muted:#5A6573;--red:#C62828}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:var(--text);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)}

.head h1{margin:0;font-weight:900;font-size:1.6rem;line-height:1.1}
.head p{margin:.3rem 0 0;font-weight:700;opacity:.85}
.head i{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--sun)}
form{padding:1.4rem}
label{font-weight:800;display:block;margin-bottom:.4rem}
input{width:100%;font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid #CBD5E1;border-radius:10px;background:var(--card);color:var(--text)}
input:focus{outline:none;border-color:var(--line)}
button{margin-top:.9rem;width:100%;font:inherit;font-weight:900;font-size:1rem;padding:12px;border:0;border-radius:10px;background:var(--line);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-weight:800;min-height:1.4em;margin:.6rem 0 0}
.hint{color:var(--muted);font-size:14px;font-weight:700;margin:.4rem 0 0}
</style></head>

const K='e8-u1-s1-gate';
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.v)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
async function tryCode(code,quiet){
  try{const html=await open(code);try{localStorage.setItem(K,code)}catch(e){}
    document.open();document.write(html);document.close();return true}
  catch(e){if(!quiet)document.getElementById('e').textContent='Der Code stimmt nicht. Achte auf Bindestriche.';return false}
}
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('b');b.disabled=true;b.textContent='Prüfe …';

(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(e){}if(s&&!(await tryCode(s,true))){try{localStorage.removeItem(K)}catch(e){}}})();
